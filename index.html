<style>
:root{--bg:#eef3f3;--card:#fff;--ink:#14252a;--mute:#5d7378;--line:#d5e0e1;--acc:#d96b0b;--acc2:#0f8f84;--soft:#e4eeee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

:root[data-theme="dark"]{--bg:#0e1517;--card:#162126;--ink:#e8f1f2;--mute:#8aa3a8;--line:#25353b;--acc:#f2a54a;--acc2:#34c4b5;--soft:#1d2c32;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.wrap{max-width:640px;margin:0 auto;padding:14px 14px 110px}
.hero{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:16px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .big{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800}
.hero small{color:var(--mute);display:block}

.week i.on{background:var(--acc2)}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-right:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px}
.top button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}
.top button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.card h3{font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 span{font:700 12px "DM Sans";color:var(--mute)}
.gym{display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-radius:28px;padding:16px 18px}
.gym b{font:800 20px "Bricolage Grotesque",sans-serif;display:block}
.gym small{color:var(--mute)}
.gym.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.gym.on small{color:#fff;opacity:.85}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row.done .t{text-decoration:line-through;color:var(--mute)}
.t{flex:1}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.15s}
.chk.on{background:var(--acc2);border-color:var(--acc2)}
.chk.on::after{content:"✓";color:#fff;font-weight:800;font-size:14px}
.gym .chk{width:34px;height:34px;border-radius:12px}
input,select,button{font:inherit}
input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=range]{padding:0;accent-color:var(--acc2);width:100%}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.g{background:var(--soft);color:var(--ink)}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:18px;padding:2px 6px}
.ed{display:flex;gap:8px;margin-top:8px}
.ed input{flex:1}
.glass{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.glass b{width:30px;height:38px;border-radius:6px 6px 12px 12px;border:2px solid var(--line);cursor:pointer;transition:.15s}
.glass b.on{background:var(--acc2);border-color:var(--acc2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-weight:700;cursor:pointer;flex:none}
.chips button.sel{background:var(--ink);color:var(--bg)}
.chips button.td{border-color:var(--acc);}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:99px;transition:width .3s}
.bar i.over{background:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mute{color:var(--mute);font-size:13px}
.num{font:800 22px "Bricolage Grotesque",sans-serif}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav div{display:flex;max-width:640px;width:100%;gap:4px}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:7px 0;border-radius:14px;font-weight:700;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.sel{background:var(--soft);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.2s ease}
#toast.show{opacity:1;transform:translateX(-50%)}
.more-wrap{display:flex;justify-content:flex-end;margin:6px 0;position:relative}.more-wrap details{position:relative}.more-wrap summary{list-style:none;cursor:pointer;font-size:24px;padding:2px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
var K="routine-tracker-v1",S2={tab:0,edit:false,wd:null};

{n:"Lunch",t:"1:00 PM",i:["120 g chicken breast (raw weight)","150 g cooked rice","150 g vegetables","Curd 100 g"]},

 days:{},

 ["AI","Python for AI",30],["AI","LLM APIs and RAG",15],["AI","Prompt engineering",25],
 ["Data Engineering","Advanced SQL",40],["Data Engineering","PySpark",5],["Data Engineering","Airflow",0],["Data Engineering","dbt",0],["Data Engineering","Kafka basics",0]].map(function(a){return[a[0],a[1],a[2]]}),
 money:{sip:6000,rd:12500,paid:{},extra:[],exp:[],budget:20000}};

S=S||DEF;

X("Back + Biceps",["Lat pulldown 3 × 8–12","Chest-supported row 3 × 8–12","Seated cable row 2 × 10–12","Straight-arm pulldown 2 × 12–15","EZ-bar curl 3 × 10–12","Hammer curl 2 × 10–12"]),
X("Shoulders + Abs ★",["Seated dumbbell shoulder press 3 × 8–10","Dumbbell lateral raises 4 × 12–15","Cable lateral raises 3 × 12–15","Reverse pec deck 3 × 12–15","Cable crunch 3 × 15","Plank 3 × 45 s"]),
X("Legs",["Squats 3 × 8–10","Romanian deadlift 3 × 8–10","Leg press 3 × 10–12","Leg curl 3 × 12","Leg extension 2 × 12–15","Calf raises 3 × 15"]),
X("Chest + Shoulders ★",["Incline barbell press 3 × 8–10","Flat dumbbell press 3 × 10–12","Pec deck fly 2 × 12–15","Machine shoulder press 2 × 10–12","Cable lateral raises 3 × 12–15","Push-ups 2 × 12"]),
X("Cardio + Recovery",["Incline treadmill 25–30 min","Brisk walking 20 min","Light mobility and stretching"]),
X("Rest day",["Complete rest"])]
var Z=function(c,a){return a.map(function(t){return{c:c,n:t,p:0,h:0}})};
S.skills=[].concat(
Z("Phase 1 · Python, SQL, Linux",["Wk 1–4 · Python basics: data types, collections, functions, modules, exceptions","Wk 5 · OOP, classes, inheritance, file handling","Wk 6 · APIs, JSON, requests","Wk 7 · SQL queries and data modeling","Wk 8 · Python practice and mini-project"]),
Z("Phase 2 · Big data engineering",["Wk 9 · Big data concepts, Hadoop, HDFS","Wk 10 · Spark architecture, SparkSession, DataFrames","Wk 11 · Transformations, actions, Spark SQL","Wk 12 · Data pipelines and troubleshooting"]),
Z("Phase 3 · AWS data engineering",["Wk 17 · Cloud basics, AWS account, IAM, security","Wk 18 · S3, EC2, VPC, networking","Wk 19 · Lambda, CloudWatch, EventBridge","Wk 20 · AWS CLI, Boto3, projects"]),
Z("Phase 4 · DevOps",["Wk 25 · Linux administration, Bash scripting","Wk 26 · Git, GitHub, branching, pull requests","Wk 27 · Docker, Dockerfile, images, containers","Wk 28 · Docker Compose, CI pipelines"]));
S.v=2}
if(S.v===2){
var q=S.skills.findIndex(function(s){return s.n.indexOf("Python basics")>-1});
if(q>-1){var o=S.skills[q],w=["Wk 1 · Variables, data types, operators, input/output (calculator, unit converter)","Wk 2 · Conditions, loops, strings (number guessing game, text analyzer)","Wk 3 · Lists, tuples, dictionaries, functions (task manager app)","Wk 4 · Files, modules, exceptions (habit tracker)" ]
S.skills.splice.apply(S.skills,[q,1].concat(w.map(function(t,i){return{c:o.c,n:t,p:o.p,h:i?0:o.h}}))) }
var A={"Wk 5 ":"employee management app","Wk 6 ":"API data extraction app","Wk 7 ":"build a relational database","Wk 8 ":"SQL analytics and shell scripts"};
S.skills.forEach(function(s){for(var k in A)if(s.n.indexOf(k)===0&&s.n.indexOf("(")<0)s.n+=" ("+A[k]+")"});
S.v=3}
if(S.v===3){
var Y=function(c,a){return a.map(function(t){return{c:c,n:t,p:0,h:0}})};
var B={"Wk 25 ":"automate system tasks","Wk 26 ":"manage a project using Git","Wk 27 ":"containerize a Python app","Wk 28 ":"create an automated CI pipeline","Wk 29 ":"deploy an app locally","Wk 30 ":"write a README and monitor logs"};
S.skills.forEach(function(s){for(var k in B)if(s.n.indexOf(k)===0&&s.n.indexOf("(")<0)s.n+=" ("+B[k]+")"});
S.skills=S.skills.concat(
Y("Phase 5 · ML, LLMs, RAG and AI agents",["Wk 33 · Statistics, probability, linear algebra basics (analyze a dataset)","Wk 34 · ML algorithms, scikit-learn (build a classification model)","Wk 35 · LLM APIs and embeddings (chat over a corpus)","Wk 36 · RAG pipeline and vector search"]),
Y("Phase 6 · Advanced engineering and interview prep",["Wk 41 · Distributed systems fundamentals (design a distributed pipeline)","Wk 42 · System design, scalability, fault tolerance (design a service)","Wk 43 · Behavioral interview preparation","Wk 44 · Mock interviews and final review"]));
S.v=4}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function td(){return new Date().toLocaleDateString("en-CA")}
function D(){var k=td();return S.days[k]||(S.days[k]={c:{},w:0,cd:[],wt:"",p:0})}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function rs(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function wdi(){return (new Date().getDay()+6)%7}
var DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function keys(){var k=["gym"];S.plan.meals.forEach(function(m,a){m.i.forEach(function(x){k.push("m"+a+x)})});S.plan.supps.forEach(function(x){k.push("s"+x)});S.plan.split[wdi()].e.forEach(function(x){k.push("w"+x)});return k}
function pct(){var k=keys(),c=D().c;return k.length?k.filter(function(x){return c[x]}).length/k.length:0}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.className="show";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=""},2200)}
function tg(k){var d=D(),was=pct()>=1;d.c[k]=!d.c[k];save();render();if(!was&&pct()>=1)toast("Everything done today 🎉")}

function chk(on){return '<span class="chk '+(on?"on":"")+'"></span>'}

/* edit helpers: idx = meal number, "s" supps, "w" workout day */

function supplementReminder(){var r=R()[0],time=('0'+(r.h%12+(r.p==='PM'?12:0))).slice(-2)+':'+('0'+r.m).slice(-2);return `<div class="reminder-inline"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>⏰ Supplement reminder</b><button class="btn ${r.on?'':'g'}" style="padding:6px 12px" onclick="remO(0)">${r.on?'On':'Off'}</button></div><div class="ed"><input type="time" value="${time}" onchange="var p=this.value.split(':');r=R()[0];r.h=(+p[0]%12)||12;r.m=+p[1];r.p=+p[0]<12?'AM':'PM';r.fired='';save();render()"><button class="btn g" onclick="testR()">Test</button></div><p class="mute">A daily reminder for your supplements. The app must be open for in-app reminders to trigger.</p></div>`}
function vToday(){var d=D(),c=d.c,P=S.plan,h='';
P.meals.forEach(function(m,a){var done=m.i.filter(function(x){return c["m"+a+x]}).length;
h+='<div class="card"><h3>'+(S2.edit?'<input value="'+esc(m.n)+'" onchange="S.plan.meals['+a+'].n=this.value;save()" style="width:48%"><input value="'+esc(m.t)+'" onchange="S.plan.meals['+a+'].t=this.value;save()" style="width:36%"><button class="x" onclick="S.plan.meals.splice('+a+',1);save();render()">✕</button>':m.n+'<span>'+m.t+" · "+done+"/"+m.i.length+'</span>')+'</h3>'+list(m.i,"m"+a,a)+(S2.edit?'<button class="btn g" style="margin-top:8px" onclick="ai('+a+')">+ Add food</button>':"")+'</div>'});
if(S2.edit)h+='<button class="btn" style="margin-top:12px;width:100%" onclick="S.plan.meals.push({n:\'New meal\',t:\'6:00 PM\',i:[\'New item\']});save();render()">+ Add meal</button>';

var ml=d.ml||0,gl=P.waterL||3;h+='<div class="card"><h3>Water<span>'+(ml/1000).toFixed(2).replace(/\.?0+$/,"")+" / "+gl+' L</span></h3><div class="bar"><i style="width:'+Math.min(100,ml/(gl*10))+'%"></i></div>';
for(var i=1;i<=Math.ceil(gl);i++){var f=Math.max(0,Math.min(1,ml/1000-(i-1)));h+='<div onclick="wb('+i+')" style="cursor:pointer;text-align:center"><div style="width:54px;height:96px;border:3px solid var(--line);border-radius:16px 16px 18px 18px;overflow:hidden;background:linear-gradient(to-top, var(--acc2) 0%, var(--acc2) '+(f*100)+'%, rgba(0,0,0,0) '+(f*100)+'%, rgba(0,0,0,0) 100%);margin:8px auto 0"><div style="height:'+(92*(1-f))+'px"></div></div><small class="mute">'+i+'L</small></div>';} 
h+='</div></div>'+vSleep()+'<p class="mute" style="text-align:center;margin-top:16px">Daily checks reset every midnight. Your history keeps the streak going.</p>' ;return h}
function vWork(){var P=S.plan,wi=S2.wd==null?wdi():S2.wd,s=P.split[wi],d=D(),c=d.c,isT=wi===wdi();
var h=gymCard()+reminderCard()+'<div class="chips" style="margin-top:12px">'+DN.map(function(n,i){return '<button class="'+(i===wi?"sel ":"")+(i===wdi()?"td":"")+'" onclick="S2.wd='+i+';render()">'+n+'</button>'}).join("")+'</div>';
h+='<div class="card"><h3>'+(S2.edit?'<input value="'+esc(s.f)+'" onchange="S.plan.split['+wi+'].f=this.value;save()" style="width:100%">':esc(s.f)+'<span>'+DN[wi]+(isT?" · today":"")+'</span>')+'</h3>';
h+=s.e.map(function(x,i){return S2.edit?'<div class="ed"><input value="'+esc(x)+'" onchange="ei(\'w\','+i+',this.value)"><button class="x" onclick="di(\'w\','+i+')">✕</button></div>':'<div class="row '+(c["w"+x]&&isT?"done":"")+'" '+(isT?'onclick="tg(\'w'+x.replace(/'/g,"\\'")+'\')"':'')+'>'+(isT?chk(c["w"+x]):'<span class="chk"></span>')+'<span class="t">'+esc(x)+'</span></div>'}).join("");
if(S2.edit)h+='<button class="btn g" style="margin-top:8px" onclick="ai(\'w\')">+ Add exercise</button>';
else if(!isT)h+='<p class="mute">Open today’s tab to tick exercises off.</p>';h+='</div>';
